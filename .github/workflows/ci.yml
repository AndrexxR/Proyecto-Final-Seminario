name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar herramientas (versiones fijadas en pyproject.toml)
        run: pip install ruff==0.16.9 pytest==9.2.0
      - name: Linter
        run: ruff check .
      - name: Pruebas
        run: python -m pytest -v

  auditoria:
    # Se audita el entorno de herramientas en una sola versión, con pip y setuptools al día.
    # El proyecto no tiene dependencias de ejecución (dependencies = [] en pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Actualizar pip y setuptools del servidor
        run: python -m pip install --upgrade pip setuptools
      - name: Instalar herramientas
        run: pip install ruff==0.16.9 pytest==9.2.0 pip-audit==2.10.1
      - name: Auditoría de dependencias
        run: pip-audit
