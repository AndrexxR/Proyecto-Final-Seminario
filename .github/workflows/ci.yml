name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar herramientas (versiones fijadas en pyproject.toml)
        run: pip install ruff==0.16.9 pytest==9.2.0 pip-audit==2.10.1
      - name: Linter
        run: ruff check .
      - name: Pruebas
        run: python -m pytest -v
      - name: Auditoría de dependencias
        run: pip-audit
